version: 2
# surpy's private index: see README "Known limitations".
registries:
  surpy:
    type: python-index
    url: https://us-central1-python.pkg.dev/surmado/surpy/simple/
    workload-identity-provider: projects/786881952931/locations/global/workloadIdentityPools/github/providers/github
    service-account: dependabot-surpy-reader@surmado.iam.gserviceaccount.com
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # NOTE: uv does not support dependency-type (prod/dev split) yet.
    # See https://github.com/dependabot/dependabot-core/issues/13202
    # surpy: see README "Known limitations".
    registries:
      - surpy
    ignore:
      - dependency-name: "surpy"
      # A stripe major is a planned migration, not a bump: v15 drops StripeObject's dict behaviour, which dict-fed tests can't catch.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      major:
        patterns: ["*"]
        update-types:
          - "major"
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      major:
        patterns: ["*"]
        update-types:
          - "major"
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
